[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/rabbitmq.log
stderr_logfile=/var/log/supervisor/rabbitmq.err

[program:activemq]
command=/opt/scripts/start-activemq.sh
user=activemq
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/activemq.log
stderr_logfile=/var/log/supervisor/activemq.err

[program:kafka]
command=/opt/scripts/start-kafka.sh
user=kafka
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/kafka.log
stderr_logfile=/var/log/supervisor/kafka.err

[program:nats]
command=/opt/nats/nats-server --jetstream --http_port 8222 --port 4222
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/nats.log
stderr_logfile=/var/log/supervisor/nats.err

[program:simplemq]
command=/usr/bin/python3 /opt/demos/simplemq.py
autostart=true
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/simplemq.log
stderr_logfile=/var/log/supervisor/simplemq.err

[program:hermes]
command=/usr/bin/python3 /opt/demos/hermes.py
autostart=true
autorestart=true
priority=70
stdout_logfile=/var/log/supervisor/hermes.log
stderr_logfile=/var/log/supervisor/hermes.err
